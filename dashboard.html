<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒展業績速報</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0; padding: 20px;
            background-color: #f0f4f8;
            color: #333333;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 2.2rem; color: #1565c0; font-weight: 700; letter-spacing: 1px; }
        .header p { margin: 8px 0 0 0; color: #7f8c8d; font-size: 0.95rem; }
        
        .kpi-container {
            display: flex; gap: 20px; margin-bottom: 30px;
            flex-wrap: wrap; justify-content: center;
        }
        .kpi-card {
            background-color: #ffffff;
            border-radius: 16px; padding: 24px 20px;
            flex: 1; min-width: 180px; max-width: 250px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
            border-top: 5px solid #2196f3;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .kpi-card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(33, 150, 243, 0.15); }
        
        .kpi-card:nth-child(2) { border-top-color: #42a5f5; }
        .kpi-card:nth-child(3) { border-top-color: #90caf9; }
        .kpi-card:nth-child(4) { border-top-color: #b0bec5; }
        .kpi-card:nth-child(5) { border-top-color: #ff9800; } /* 樣品專屬橘色 */

        .kpi-title { font-size: 1.05rem; color: #7f8c8d; margin-bottom: 10px; font-weight: 600; }
        .kpi-value { font-size: 2.2rem; font-weight: bold; color: #2c3e50; margin: 0; }
        
        .charts-container { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
        .chart-box {
            background-color: #ffffff; border-radius: 16px; padding: 24px;
            flex: 1; min-width: 300px; max-height: 400px;
            display: flex; flex-direction: column;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }
        .chart-box h2 {
            margin-top: 0; font-size: 1.3rem; color: #34495e;
            text-align: center; border-bottom: 2px solid #f0f4f8;
            padding-bottom: 12px; margin-bottom: 20px; flex-shrink: 0;
        }
        
        .ranking-list {
            flex-grow: 1; overflow-y: auto; padding-right: 10px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .ranking-list::-webkit-scrollbar { width: 6px; }
        .ranking-list::-webkit-scrollbar-thumb { background-color: #cfd8dc; border-radius: 4px; }
        
        .ranking-item {
            position: relative; padding: 12px 16px; border-radius: 8px;
            background-color: #f8f9fa; z-index: 1;
            display: flex; justify-content: space-between; align-items: center;
        }
        .ranking-bar {
            position: absolute; top: 0; left: 0; height: 100%;
            z-index: -1; border-radius: 8px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .ranking-bar.sales { background: linear-gradient(90deg, #e3f2fd 0%, #bbdefb 100%); }
        .ranking-bar.sample { background: linear-gradient(90deg, #fff3e0 0%, #ffe0b2 100%); }
        
        .ranking-name { font-weight: 600; color: #2c3e50; font-size: 1.05rem; }
        .ranking-count { font-weight: bold; font-size: 1.1rem; }
        .ranking-count.sales { color: #1565c0; }
        .ranking-count.sample { color: #e65100; }

        .refresh-btn {
            display: block; margin: 30px auto;
            background-color: #1976d2; color: #ffffff;
            border: none; border-radius: 30px;
            padding: 12px 30px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(25, 118, 210, 0.3);
        }
        .refresh-btn:hover { background-color: #1565c0; transform: scale(1.05); box-shadow: 0 6px 20px rgba(25, 118, 210, 0.4); }
        .loading { text-align: center; font-size: 1.2rem; color: #1976d2; display: none; font-weight: bold; margin-bottom: 15px;}
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 酒展業績速報</h1>
        <p id="last-update">最後更新時間：載入中...</p>
    </div>

    <div id="loading" class="loading">🔄 數據即時同步中，請稍候...</div>

    <div class="kpi-container">
        <div class="kpi-card">
            <div class="kpi-title">總營業額 (TWD)</div>
            <div class="kpi-value" id="total-revenue">$0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">現金收款</div>
            <div class="kpi-value" id="cash-revenue">$0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">數位支付</div>
            <div class="kpi-value" id="digital-revenue">$0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">實質訂單數</div>
            <div class="kpi-value" id="total-orders">0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title" style="color: #f57c00;">樣品消耗總數</div>
            <div class="kpi-value" id="total-samples" style="color: #e65100;">0</div>
        </div>
    </div>

    <!-- 銷售排行與圓餅圖 -->
    <div class="charts-container">
        <div class="chart-box" style="flex: 2;">
            <h2>🏆 暢銷酒款排行 (熱力分佈)</h2>
            <div id="ranking-list" class="ranking-list"></div>
        </div>
        
        <div class="chart-box" style="flex: 1.2;">
            <h2>💳 支付方式佔比</h2>
            <div style="position: relative; flex-grow: 1; min-height: 200px;">
                <canvas id="paymentChart"></canvas>
            </div>
        </div>
    </div>

    <!-- 獨立的樣品消耗排行 -->
    <div class="charts-container">
        <div class="chart-box" style="flex: 1;">
            <h2>🎁 樣品消耗明細 (內部成本)</h2>
            <div id="sample-list" class="ranking-list"></div>
        </div>
    </div>

    <button class="refresh-btn" onclick="fetchDashboardData()">立即更新數據</button>

    <script>
        // 🔴 請替換為你正式的 GAS Web App 網址
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxGNQP7ID6l1ZJxQ-o9FstIwXSSBmGcHjO-9r87XHBS3wYs_5KlbLjtcNgTaYO_zMqm/exec";
        
        let paymentChartInstance = null;

        Chart.defaults.color = '#7f8c8d';
        Chart.defaults.font.family = '"Helvetica Neue", Helvetica, Arial, sans-serif';

        window.onload = () => fetchDashboardData();

        function fetchDashboardData() {
            document.getElementById('loading').style.display = 'block';
            fetch(`${GAS_API_URL}?action=getDashboardData`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    processAndRenderData(data);
                    document.getElementById('last-update').innerText = '最後更新時間：' + new Date().toLocaleTimeString('zh-TW');
                })
                .catch(err => {
                    document.getElementById('loading').style.display = 'none';
                    alert('獲取資料失敗，請檢查網址或權限設定：' + err);
                });
        }

        function processAndRenderData(records) {
            let totalRev = 0, cashRev = 0, digitalRev = 0;
            let totalOrders = 0, totalSamples = 0;
            let paymentCounts = { '現金': 0, 'TapPay': 0, 'LinePay': 0 };
            let itemCounts = {};
            let sampleCounts = {}; // 獨立儲存樣品統計

            records.forEach(row => {
                let amount = Number(row.total) || 0;
                let isSample = (row.payment === '樣品' || row.pickup === '現取 (樣品)');
                
                // 1. 處理營業額與訂單數 (排除樣品)
                if (!isSample) {
                    totalRev += amount;
                    totalOrders++;
                    
                    if (row.payment === '現金') cashRev += amount;
                    else digitalRev += amount;

                    if (paymentCounts[row.payment] !== undefined) paymentCounts[row.payment]++;
                    else paymentCounts[row.payment] = 1;
                }

                // 2. 處理明細品項分類
                if (row.items) {
                    let itemsArray = row.items.split(',');
                    itemsArray.forEach(itemStr => {
                        let match = itemStr.trim().match(/(.+)\s+x(\d+)/);
                        if (match) {
                            let name = match[1];
                            let qty = parseInt(match[2]);
                            
                            if (isSample) {
                                sampleCounts[name] = (sampleCounts[name] || 0) + qty;
                                totalSamples += qty;
                            } else {
                                itemCounts[name] = (itemCounts[name] || 0) + qty;
                            }
                        }
                    });
                }
            });

            document.getElementById('total-revenue').innerText = '$' + totalRev.toLocaleString();
            document.getElementById('cash-revenue').innerText = '$' + cashRev.toLocaleString();
            document.getElementById('digital-revenue').innerText = '$' + digitalRev.toLocaleString();
            document.getElementById('total-orders').innerText = totalOrders;
            document.getElementById('total-samples').innerText = totalSamples;

            renderCharts(paymentCounts, itemCounts, sampleCounts);
        }

        function renderCharts(paymentCounts, itemCounts, sampleCounts) {
            // 處理圓餅圖
            const paymentLabels = Object.keys(paymentCounts);
            const paymentData = Object.values(paymentCounts);

            if (paymentChartInstance) paymentChartInstance.destroy();
            const ctxPay = document.getElementById('paymentChart').getContext('2d');
            paymentChartInstance = new Chart(ctxPay, {
                type: 'doughnut',
                data: {
                    labels: paymentLabels,
                    datasets: [{
                        data: paymentData,
                        backgroundColor: ['#2196f3', '#4fc3f7', '#b0bec5'],
                        borderWidth: 2, borderColor: '#ffffff'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, cutout: '65%' }
            });

            // 處理真實銷售熱力圖
            const rankingList = document.getElementById('ranking-list');
            rankingList.innerHTML = '';
            
            let sortedItems = Object.keys(itemCounts).map(key => {
                return { name: key, count: itemCounts[key] };
            }).sort((a, b) => b.count - a.count);

            let maxCount = sortedItems.length > 0 ? sortedItems[0].count : 1;

            if(sortedItems.length === 0) rankingList.innerHTML = '<div style="text-align:center; color:#999; padding:20px;">尚無銷售紀錄</div>';

            sortedItems.forEach((item, index) => {
                let percent = (item.count / maxCount) * 100;
                let div = document.createElement('div');
                div.className = 'ranking-item';
                div.innerHTML = `
                    <div class="ranking-bar sales" style="width: 0%;"></div>
                    <span class="ranking-name">#${index + 1} ${item.name}</span>
                    <span class="ranking-count sales">${item.count}</span>
                `;
                rankingList.appendChild(div);
                setTimeout(() => { div.querySelector('.ranking-bar').style.width = percent + '%'; }, 50);
            });

            // 處理樣品消耗熱力圖
            const sampleList = document.getElementById('sample-list');
            sampleList.innerHTML = '';
            
            let sortedSamples = Object.keys(sampleCounts).map(key => {
                return { name: key, count: sampleCounts[key] };
            }).sort((a, b) => b.count - a.count);

            let maxSample = sortedSamples.length > 0 ? sortedSamples[0].count : 1;

            if(sortedSamples.length === 0) sampleList.innerHTML = '<div style="text-align:center; color:#999; padding:20px;">尚無開瓶樣品紀錄</div>';

            sortedSamples.forEach((item, index) => {
                let percent = (item.count / maxSample) * 100;
                let div = document.createElement('div');
                div.className = 'ranking-item';
                div.innerHTML = `
                    <div class="ranking-bar sample" style="width: 0%;"></div>
                    <span class="ranking-name">#${index + 1} ${item.name}</span>
                    <span class="ranking-count sample">${item.count}</span>
                `;
                sampleList.appendChild(div);
                setTimeout(() => { div.querySelector('.ranking-bar').style.width = percent + '%'; }, 50);
            });
        }
    </script>
</body>
</html>
